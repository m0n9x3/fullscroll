<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FullScroll Horizon Only 데모</title><link rel="stylesheet" href="../../node_modules/swiper/swiper-bundle.min.css"><link rel="stylesheet" href="../../dist/fullscroll.css"><link rel="stylesheet" href="../demo-kit.css"><style>.horizon-arrows{position:fixed;right:18px;bottom:18px;z-index:41;display:flex;gap:8px}.horizon-arrows button{width:46px;height:46px;border:1px solid rgb(255 255 255 / 38%);border-radius:50%;background:rgb(0 0 0 / 42%);color:#fff;font-size:22px;cursor:pointer}.horizon-arrows button:disabled{opacity:.28;cursor:default}</style></head><body>
<p class="demo-note" fs-ignore><strong>fs-horizon-only</strong> · 좌우 키/가로 스와이프는 내부 이동, 위아래 입력은 가로 슬라이드를 건너뛰고 세로 페이지로 이동합니다.</p><p class="demo-links" fs-ignore><a href="../docs/">문서로 돌아가기</a></p>
<nav class="horizon-arrows" fs-ignore aria-label="가로 슬라이드 이동"><button type="button" id="horizon-prev" aria-label="이전 가로 슬라이드">←</button><button type="button" id="horizon-next" aria-label="다음 가로 슬라이드">→</button></nav>
<main fs><section class="panel blue"><div><h1>이전 세로 페이지</h1><p>다음 입력으로 가로 그룹 첫 화면에 들어갑니다.</p></div></section><section fs-horizon fs-horizon-only><article class="panel teal"><div><h2>Only 1</h2><p>좌우로 Only 2, 3을 확인할 수 있습니다.</p></div></article><article class="panel sky"><div><h2>Only 2</h2><p>여기서 아래로 이동하면 Only 3이 아니라 다음 세로 페이지로 갑니다.</p></div></article><article class="panel purple"><div><h2>Only 3</h2><p>세로 이동은 가로 내부를 가두지 않습니다.</p></div></article></section><section class="panel orange"><div><h2>다음 세로 페이지</h2><p>위로 돌아가면 가로 그룹 첫 화면으로 진입합니다.</p></div></section></main>
<script src="../../node_modules/swiper/swiper-bundle.min.js"></script><script src="../../dist/fullscroll.js"></script><script>const demo=new FullScroll('[fs]',{Swiper,dots:true,history:true});const arrows=document.querySelector('.horizon-arrows');const prev=document.querySelector('#horizon-prev');const next=document.querySelector('#horizon-next');const sync=()=>{const route=demo.state.current;const horizon=route&&demo.horizons.get(route.pageIndex);const active=Boolean(horizon?.only&&route.slideIndex!==null);arrows.hidden=!active;prev.disabled=!active||route.slideIndex===0;next.disabled=!active||route.slideIndex===horizon.slides.length-1};const moveWithinHorizon=(offset)=>{const route=demo.state.current;if(route?.slideIndex===null)return;demo.moveTo(route.pageIndex,route.slideIndex+offset,{trigger:'demo-control'})};prev.addEventListener('click',()=>moveWithinHorizon(-1));next.addEventListener('click',()=>moveWithinHorizon(1));document.querySelector('[fs]').addEventListener('fullscroll:change',sync);sync();</script></body></html>
