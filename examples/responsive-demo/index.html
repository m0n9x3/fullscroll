<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FullScroll 반응형 데모</title><link rel="stylesheet" href="../../node_modules/swiper/swiper-bundle.min.css"><link rel="stylesheet" href="../../dist/fullscroll.css"><link rel="stylesheet" href="../demo-kit.css"><style>.viewport{position:fixed;top:18px;left:18px;z-index:41;padding:8px 11px;border-radius:999px;background:#fff;color:#111827;font-size:12px;font-weight:800}</style></head><body>
<output class="viewport" fs-ignore>확인 중</output><p class="demo-note" fs-ignore><strong>breakpoint: 720</strong> · 창 너비를 720px 이하로 줄이면 FullScroll이 일반 세로 문서로 전환됩니다.</p><p class="demo-links" fs-ignore><a href="../docs/">문서로 돌아가기</a></p>
<main fs><section class="panel blue"><div><h1>반응형 1</h1><p>넓은 화면에서는 FullScroll 이동이 동작합니다.</p></div></section><section class="panel purple"><div><h2>반응형 2</h2><p>720px 이하에서는 이 화면들이 일반 문서처럼 세로로 쌓입니다.</p></div></section><section class="panel light"><div><h2>반응형 3</h2><p>JavaScript가 실패해도 읽을 수 있는 기본 구조입니다.</p></div></section></main>
<script src="../../node_modules/swiper/swiper-bundle.min.js"></script><script src="../../dist/fullscroll.js"></script><script>const root=document.querySelector('[fs]');const demo=new FullScroll(root,{Swiper,dots:true,breakpoint:720,history:true});const out=document.querySelector('.viewport');const update=()=>out.textContent=`${innerWidth}px · ${demo.state.responsive?'일반 문서 모드':'FullScroll 모드'}`;addEventListener('resize',update);root.addEventListener('fullscroll:responsive',update);update();</script></body></html>
