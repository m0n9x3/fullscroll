<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FullScroll 테마 데모</title><link rel="stylesheet" href="../../node_modules/swiper/swiper-bundle.min.css"><link rel="stylesheet" href="../../dist/fullscroll.css"><link rel="stylesheet" href="../demo-kit.css"><style>#demo-header{position:fixed;top:18px;left:18px;z-index:41;padding:9px 13px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.1em;transition:background .25s,color .25s}#demo-header[fs-theme=dark]{background:#111827;color:#fff}#demo-header[fs-theme=light]{background:#fff;color:#111827}</style></head><body>
<header id="demo-header" fs-theme="dark">HEADER THEME</header><p class="demo-note" fs-ignore><strong>fs-theme</strong> · 화면을 이동할 때 좌상단 헤더의 색상이 자동으로 바뀝니다. 별도 이벤트 코드는 필요 없습니다.</p><p class="demo-links" fs-ignore><a href="../docs/">문서로 돌아가기</a></p>
<main fs><section class="panel slate" fs-theme="dark"><div><h1>Dark</h1><p>현재 섹션의 <code>fs-theme="dark"</code>가 헤더에도 복사됩니다.</p></div></section><section class="panel light" fs-theme="light"><div><h2>Light</h2><p><code>themeTarget: '#demo-header'</code>가 대상입니다.</p></div></section><section class="panel purple" fs-theme="dark"><div><h2>Dark Again</h2><p>가로 슬라이드에도 같은 선언을 쓸 수 있습니다.</p></div></section></main>
<script src="../../node_modules/swiper/swiper-bundle.min.js"></script><script src="../../dist/fullscroll.js"></script><script>new FullScroll('[fs]',{Swiper,dots:true,themeTarget:'#demo-header',history:true});</script></body></html>
