name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 연속으로 푸시하면 이전 실행을 취소해 Actions 시간을 아낍니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 지원 범위를 좁히기 전까지 세 버전을 모두 검증합니다.
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 구문 검사, jsdom 테스트, dist 빌드, 타입 검사, 배포물 검사를 한 번에 수행합니다.
      - name: Run check
        run: npm run check

  browser:
    name: browser (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-node-${{ matrix.node }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
